{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Artículos y proyectos para explorar el mundo de la robótica.">
    <title>{% block title %}{{ site_profile.site_name|default:"Bitácora Robótica" }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'articles/site.css' %}">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark" aria-hidden="true">RB</span>
                <span>{{ site_profile.site_name|default:"Bitácora Robótica" }}</span>
            </a>
            <nav aria-label="Navegación principal">
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'about' %}">Sobre mí</a>
            </nav>
        </div>
    </header>
    <main id="contenido" class="page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Ideas, proyectos y aprendizajes sobre robótica.</p>
    </footer>
</body>
</html>
